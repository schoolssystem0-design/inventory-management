name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The generated API types must match the committed OpenAPI document.
      - name: API types drift check
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API with demo data
        working-directory: backend
        run: |
          ./mvnw -B -q test-compile
          nohup ./mvnw -B spring-boot:test-run "-Dspring-boot.run.main-class=com.selectcode.pos.LocalDevApplication" > api.log 2>&1 &
          # Health answers before the demo shops are seeded; wait for the ready line printed after seeding.
          for i in $(seq 1 180); do grep -q "Local API ready" api.log && break; sleep 2; done
          grep -q "Local API ready" api.log || { tail -50 api.log; exit 1; }
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          E2E_CHANNEL=chromium npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            frontend/test-results
            backend/api.log

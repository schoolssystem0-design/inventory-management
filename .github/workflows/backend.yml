name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, integration tests on embedded PostgreSQL, architecture rules, tenant isolation sweep.
      - run: ./mvnw -B verify
      # The committed OpenAPI document must match the code (the frontend generates its types from it).
      - name: OpenAPI drift check
        run: git diff --exit-code -- openapi.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

# Defaults for every environment. Secrets come from environment variables only (docs/planning/DEPLOYMENT-RUNBOOK.md §4).
spring:
  application:
    name: pos-backend
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime connection: restricted LOGIN role (member of pos_app), so row-level security applies.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pos}}
    username: ${DB_APP_USER:pos_app_login}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the database owner.
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:${PGUSER:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${PGPASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    timeout: ${APP_SESSION_IDLE_MINUTES:30}m
    jdbc:
      initialize-schema: never
  mail:
    port: 587
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 15000
      "[mail.smtp.writetimeout]": 15000
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  # Root domain of the web app: shops live at <code>.<root-domain>, the platform portal at admin.<root-domain>
  root-domain: ${APP_ROOT_DOMAIN:localhost:3000}
  # Scheme for links in emails
  web-scheme: ${APP_WEB_SCHEME:http}
  # On *.vercel.app (or when true): shops at /s/<code>/… and platform at /login and /platform/…
  path-routing: ${APP_PATH_ROUTING:false}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:SelectCode POS}
    # Email by HTTPS API instead of SMTP: brevo or resend, with MAIL_API_KEY
    provider: ${MAIL_PROVIDER:}
    api-key: ${MAIL_API_KEY:}
  bootstrap:
    # First super admin (only used when no platform user exists); remove after first sign-in
    superadmin-email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
    superadmin-password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
    superadmin-name: ${BOOTSTRAP_SUPERADMIN_NAME:System Owner}
  files:
    local-dir: ${APP_FILES_LOCAL_DIR:}
    r2-endpoint: ${R2_ENDPOINT:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-bucket: ${R2_BUCKET:}
  db:
    # Runtime role created/updated after each migration (AppDatabaseRoleCallback)
    app-user: ${DB_APP_USER:pos_app_login}
    app-password: ${DB_APP_PASSWORD:}
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # Origin patterns, e.g. https://*.selectcodepos.com (every shop subdomain)
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://*.localhost:3000}
    cookie-domain: ${APP_COOKIE_DOMAIN:}
    cookie-secure: ${APP_COOKIE_SECURE:true}
    signin-limit-per-network: ${APP_SIGNIN_LIMIT:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: staging
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: local
app:
  security:
    cookie-secure: false
